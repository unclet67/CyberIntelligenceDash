services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cyberintel
      POSTGRES_USER: cyberintel
      POSTGRES_PASSWORD: cyberintel-local
    volumes:
      - cyberintel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberintel -d cyberintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cyberintel:cyberintel-local@db:5432/cyberintel
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      SEED_ON_STARTUP: "true"
      AUTH_REQUIRED: "false"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker", "--source", "all"]
    profiles: ["ingestion"]
    environment:
      DATABASE_URL: postgresql+psycopg://cyberintel:cyberintel-local@db:5432/cyberintel
      MITRE_STIX_URL: ${MITRE_STIX_URL:-https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json}
      MALPEDIA_BASE_URL: ${MALPEDIA_BASE_URL:-https://malpedia.caad.fkie.fraunhofer.de}
      MALPEDIA_API_TOKEN: ${MALPEDIA_API_TOKEN:-}
      THREATFOX_API_URL: ${THREATFOX_API_URL:-https://threatfox-api.abuse.ch/api/v1/}
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      THREATFOX_DAYS: ${THREATFOX_DAYS:-7}
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-3600}
    depends_on:
      api:
        condition: service_healthy

volumes:
  cyberintel_postgres:
