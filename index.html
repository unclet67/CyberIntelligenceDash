function tint(hex){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  const mix=(c)=>Math.round(c+(255-c)*0.88);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}
function badgeStyle(sev){
  const c = SEV[sev] || SEV.medium;
  return `background:${c.bg};color:${c.text};font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;padding:4px 10px;border-radius:5px`;
}
function dotStyle(sev, size){
  const c = SEV[sev] || SEV.medium;
  return `width:${size||8}px;height:${size||8}px;border-radius:50%;background:${c.dot};flex:none`;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

const ttpBadgeStyle = `background:${accentTint};color:${accent};font-size:12px;font-weight:500;padding:6px 11px;border-radius:6px;font-family:var(--mono)`;

function coverageActors(){ return actors.filter(a => a.id !== 'a6'); }
function cellColor(level){ return ['#e5e7eb','#c7d2fe','#818cf8','#4338ca'][level] || '#e5e7eb'; }
function techLevel(id, filterId){
  if(filterId === 'all'){
    const count = coverageActors().filter(a => a.ttps.includes(id)).length;
    return count === 0 ? 0 : count === 1 ? 1 : count === 2 ? 2 : 3;
  }
  const a = actors.find(a => a.id === filterId);
  return (a && a.ttps.includes(id)) ? 3 : 0;
}
function actorById(id){ return actors.find(a => a.id === id) || actors[0]; }
function initialsOf(name){ return name.split(' ').map(w=>w[0]).join(''); }
function sevAvatarStyle(sev){
  return `width:52px;height:52px;border-radius:12px;background:${SEV[sev].bg};color:${SEV[sev].text};font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none`;
}
function statusStyleFor(status){
  return status==='active'
    ? 'background:#f0fdf4;color:#15803d;font-size:11px;font-weight:600;text-transform:uppercase;padding:4px 9px;border-radius:5px'
    : 'background:#f3f4f6;color:#6b7280;font-size:11px;font-weight:600;text-transform:uppercase;padding:4px 9px;border-radius:5px';
}
function confColor(conf){ return conf==='High'?'#15803d':conf==='Medium'?'#b45309':'#6b7280'; }
function actorSourceNames(actor){
  const hasLiveProfiles = Array.isArray(actor.sourceProfiles);
  const names = (actor.sourceProfiles||[]).map(profile=>profile.source_name);
  if(!hasLiveProfiles && actor.mitreId) names.push('MITRE ATT&CK');
  if(!hasLiveProfiles && actor.malpediaSlug) names.push('Malpedia');
  return [...new Set(names)];
}
function actorSourceBadges(actor){
  return actorSourceNames(actor).map(name=>`<span style="background:#eef2ff;color:#4338ca;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px">${esc(name)}</span>`).join('');
}

}

function renderActors(){
  const search = (state.actorSearch||'').toLowerCase();
  const sevFilter = state.actorSeverityFilter||'all';
  const filtered = actors.filter(a=>{
    const ms = !search || a.name.toLowerCase().includes(search) || a.country.toLowerCase().includes(search) || (a.aliases||[]).some(al=>al.toLowerCase().includes(search));
    const mv = sevFilter==='all' || a.severity===sevFilter;
    return ms && mv;
  });
  const chips = [{id:'all',name:'All'},{id:'critical',name:'Critical'},{id:'high',name:'High'},{id:'medium',name:'Medium'},{id:'low',name:'Low'}].map(c=>{
    const style = c.id===sevFilter
      ? `padding:6px 13px;border-radius:16px;font-size:12.5px;font-weight:600;cursor:pointer;background:${accentTint};color:${accent};border:1px solid ${accent}`
      : 'padding:6px 13px;border-radius:16px;font-size:12.5px;font-weight:500;cursor:pointer;background:#fff;color:#4b5563;border:1px solid #e5e7eb';
    return `<div style="${style}" data-act="setActorSeverityFilter" data-id="${c.id}" tabindex="0" role="button">${c.name}</div>`;
  }).join('');
  const cards = filtered.map(a=>`
    <div class="card-hover" style="${CARD};padding:18px;cursor:pointer;display:flex;gap:14px" data-act="goToActor" data-id="${a.id}" tabindex="0" role="button">
      <div style="${sevAvatarStyle(a.severity)}">${initialsOf(a.name)}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="font-size:14.5px;font-weight:600;font-family:var(--display)">${esc(a.name)}</div>
          <span style="${badgeStyle(a.severity)}">${a.severity}</span>
        </div>
        <div style="font-size:12px;color:#9ca3af;margin:4px 0 10px">${esc(a.country)} · ${esc(a.sponsor)} · ${esc(a.motivation)}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">${actorSourceBadges(a)}</div>
        <div style="display:flex;gap:16px;font-size:11.5px;color:#6b7280">
          <span>${a.campaigns} campaigns</span>
          <span>${a.iocs.length} IOCs</span>
          <span>${a.techniques} techniques</span>
        </div>
      </div>
    </div>`).join('') || `<div style="grid-column:1/-1;padding:48px 20px;text-align:center;color:#9ca3af;${CARD}"><div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:4px">No actors match this filter</div><div style="font-size:13px">Try a different search term or severity.</div></div>`;

function renderIocs(){
  const chipOpts = ['All','IP','DOMAIN','HASH','URL'];
  const chips = chipOpts.map(t=>{
    const style = t===state.iocTypeFilter
      ? `background:${accent};color:#fff;font-size:12px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;flex:none`
      : 'background:#f3f4f6;color:#4b5563;font-size:12px;font-weight:500;padding:7px 14px;border-radius:7px;cursor:pointer;flex:none';
    return `<div style="${style}" data-act="setIocFilter" data-id="${t}" tabindex="0" role="button">${t}</div>`;
  }).join('');
  const rows = iocsGlobal.filter(i=>state.iocTypeFilter==='All'||i.type===state.iocTypeFilter);
  const latestSync = iocsGlobal.map(i=>i.syncedAt).filter(Boolean).sort().at(-1);
  const freshness = latestSync ? `Last synchronized ${displayDateTime(latestSync)}` : 'Bundled demonstration data';
  const bodyHtml = rows.length ? rows.map(i=>{
    const expired = i.expiresAt && new Date(i.expiresAt).getTime() <= Date.now();
    const active = i.isActive!==false && !expired;
    const context = i.malware||i.threatType||'No malware attribution';
    const detail = [i.threatType, ...(i.tags||[]).slice(0,2)].filter(value=>value&&value!==context).join(' · ');
    return `
    <div style="display:grid;grid-template-columns:0.65fr 2.2fr 1.45fr 0.9fr 1.1fr 1fr 0.75fr;gap:12px;padding:13px 20px;border-top:1px solid #f3f4f6;align-items:center;font-size:13px">
      <div style="font-size:11px;font-weight:600;color:${IOC_COLOR[i.type]||'#6b7280'}">${i.type}</div>
      <div style="min-width:0">
        <div style="font-family:var(--mono);font-size:12.5px;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(i.value)}">${esc(i.value)}</div>
        <div style="font-size:10.5px;color:#9ca3af;margin-top:3px">${esc(i.actor)}</div>
      </div>
      <div style="min-width:0">
        <div style="font-size:12.5px;color:#374151;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(context)}</div>
        <div style="font-size:10.5px;color:#9ca3af;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(detail)}</div>
      </div>
      <div style="font-size:11px;font-weight:600;color:${confColor(i.confidence)}">${i.confidence}${Number.isInteger(i.confidenceScore)?` · ${i.confidenceScore}`:''}</div>
      <div style="color:#6b7280;font-size:12px">${esc(i.source)}</div>
      <div style="color:#9ca3af;font-size:12px">${esc(i.firstSeen||'Not reported')}</div>
      <div><span style="${active?'background:#f0fdf4;color:#15803d':'background:#f3f4f6;color:#6b7280'};font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:5px">${active?'ACTIVE':'EXPIRED'}</span></div>
    </div>`;
  }).join('') : `
    <div style="padding:56px 20px;text-align:center;color:#9ca3af">
      <div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:4px">No active indicators match this filter</div>
      <div style="font-size:13px">Try a different indicator type.</div>
    </div>`;

  return `<div>
    <div style="margin-bottom:20px">
      <div style="font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-0.3px">Live Indicators</div>
      <div style="font-size:13px;color:#6b7280;margin-top:4px">${iocsGlobal.length} active indicators · ${esc(freshness)}</div>
    </div>
    <div style="${CARD};padding:20px;margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="display:flex;gap:8px;flex-wrap:wrap">${chips}</div>
        <div style="font-size:11.5px;color:#9ca3af">Expired indicators are hidden by the API</div>
      </div>
    </div>
    <div style="${CARD};overflow:hidden">
      <div style="overflow-x:auto">
        <div style="min-width:980px">
          <div style="display:grid;grid-template-columns:0.65fr 2.2fr 1.45fr 0.9fr 1.1fr 1fr 0.75fr;gap:12px;padding:14px 20px;font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid #f3f4f6">
            <div>Type</div><div>Indicator</div><div>Malware / Threat</div><div>Confidence</div><div>Source</div><div>First Seen</div><div>Status</div>
          </div>
          ${bodyHtml}
        </div>
      </div>
    </div>
  </div>`;
}

  const filterId = state.attackFilterActorId;
  const all = tacticsFull.flatMap(t=>t.techniques);
  const covered = all.filter(tech=>techLevel(tech.id,'all')>0).length;
  const pct = Math.round((covered/all.length)*100);
  const chips = [{id:'all',name:'All Actors'}, ...coverageActors().map(a=>({id:a.id,name:a.name}))].map(c=>{
    const style = c.id===filterId
      ? `background:${accent};color:#fff;font-size:12px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;flex:none`
      : 'background:#f3f4f6;color:#4b5563;font-size:12px;font-weight:500;padding:7px 14px;border-radius:7px;cursor:pointer;flex:none';
    return `<div style="${style}" data-act="setAttackFilter" data-id="${c.id}" tabindex="0" role="button">${esc(c.name)}</div>`;
  }).join('');
  const cols = tacticsFull.map(t=>{
    const cells = t.techniques.map(tech=>{
      const lvl = techLevel(tech.id, filterId);
      return `<div style="background:${cellColor(lvl)};border-radius:6px;padding:8px 9px;display:flex;flex-direction:column;gap:2px;${lvl>=2?'color:#fff':'color:#374151'}">
        <div style="font-family:var(--mono);font-size:10px;font-weight:600;opacity:0.85">${tech.id}</div>
        <div style="font-size:11.5px;font-weight:500;line-height:1.25">${esc(tech.name)}</div>
      </div>`;
    }).join('');
    return `<div style="flex:none;width:160px;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:12px;font-weight:600;color:#374151;padding:8px 4px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:6px">${t.name}</div>
      ${cells}
    </div>`;
  }).join('');
  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:20px;flex-wrap:wrap">
      <div>
        <div style="font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-0.3px">ATT&amp;CK Coverage Matrix</div>
        <div style="font-size:13px;color:#6b7280;margin-top:4px">${covered} of ${all.length} techniques observed (${pct}% coverage)</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;font-size:11.5px;color:#9ca3af">
        <span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:#e5e7eb;display:inline-block"></span>None</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:#c7d2fe;display:inline-block"></span>Low</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:#818cf8;display:inline-block"></span>Med</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:#4338ca;display:inline-block"></span>High</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">${chips}</div>
    <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px">${cols}</div>
  </div>`;
}

/* ---------------- Backend integration ---------------- */

const runtimeLocation = typeof location === 'undefined' ? {protocol:'file:', port:''} : location;
const API_ROOT = globalThis.ARGUS_API_ROOT ||
  ((runtimeLocation.protocol === 'file:' || runtimeLocation.port === '8000')
    ? 'http://127.0.0.1:8001/api'
    : '/api');

function displayDate(value){
  if(!value) return '';
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? String(value) : parsed.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});
}
function displayDateTime(value){
  if(!value) return '';
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? String(value) : parsed.toLocaleString('en-US',{month:'short',day:'2-digit',hour:'numeric',minute:'2-digit'});
}

function storedApiToken(){
  try { return globalThis.sessionStorage?.getItem('argusApiToken') || ''; }
  catch (_) { return ''; }
}

async function apiRequest(path, allowRetry=true){
  if(typeof globalThis.fetch !== 'function') throw new Error('Fetch is unavailable');
  const token = storedApiToken();
  const headers = token ? {Authorization:`Bearer ${token}`} : {};
  const response = await globalThis.fetch(`${API_ROOT}${path}`, {headers});
  if(response.status===401 && allowRetry && typeof globalThis.prompt==='function'){
    const supplied = globalThis.prompt('Enter the ARGUS TI API access token');
    if(supplied){
      globalThis.sessionStorage?.setItem('argusApiToken', supplied);
      return apiRequest(path, false);
    }
  }
  if(!response.ok) throw new Error(`API request failed (${response.status})`);
  return response.json();
}

function applyBackendData(data){
  if(!data.actors?.length) throw new Error("API returned no actor records");
  const demoActors = new Map(actors.map(actor=>[actor.id, actor]));
  const apiCampaignsByActor = new Map();
  data.campaigns.forEach(campaign=>apiCampaignsByActor.set(campaign.actor_id,(apiCampaignsByActor.get(campaign.actor_id)||0)+1));
  const apiIndicatorsByActor = new Map();
  data.indicators.forEach(indicator=>{
    if(!indicator.actor_id) return;
    const values = apiIndicatorsByActor.get(indicator.actor_id)||[];
    values.push({type:indicator.type,value:indicator.value});
    apiIndicatorsByActor.set(indicator.actor_id,values);
  });

  actors = data.actors.map(apiActor=>{
    const demo = demoActors.get(apiActor.id)||{};
    const apiDescription = apiActor.description||'';
    return {
      aliases:[], sectorBars:[], timeline:[], iocs:[], ttps:[],
      ...demo,
      id:apiActor.id,
      name:apiActor.name,
      mitreId:apiActor.mitre_id||demo.mitreId,
      sourceProfiles:apiActor.source_profiles||[],
      malpediaSlug:(apiActor.source_profiles||[]).find(profile=>profile.source_name==='Malpedia')?.external_id,
      country:apiActor.country,
      sponsor:apiActor.sponsor,
      motivation:apiActor.motivation,
      severity:apiActor.severity,
      confidence:apiActor.confidence,
      description:apiDescription.startsWith('Seed profile for ') ? (demo.description||apiDescription) : apiDescription,
      aliases:(apiActor.aliases||[]).map(alias=>alias.name),
      ttps:(apiActor.techniques||[]).map(technique=>technique.id),
      techniques:(apiActor.techniques||[]).length,
      campaigns:apiCampaignsByActor.get(apiActor.id)||0,
      timeline:(apiActor.events||[]).map(event=>({date:displayDate(event.observed_at),title:event.title,detail:event.detail})),
      iocs:apiIndicatorsByActor.get(apiActor.id)||demo.iocs||[]
    };
  });

  const demoCampaigns = new Map(campaignsAll.map(campaign=>[campaign.id,campaign]));
  campaignsAll = data.campaigns.map(campaign=>({
    ...(demoCampaigns.get(campaign.id)||{}),
    id:campaign.id,
    name:campaign.name,
    actorId:campaign.actor_id,
    sector:campaign.sector,
    status:campaign.status,
    firstSeen:displayDate(campaign.first_seen),
    lastActivity:campaign.last_seen ? displayDate(campaign.last_seen) : (demoCampaigns.get(campaign.id)?.lastActivity||'Not reported')
  }));

  const actorNames = new Map(actors.map(actor=>[actor.id,actor.name]));
  iocsGlobal = data.indicators.map(indicator=>({
    type:indicator.type,
    value:indicator.value,
    actor:actorNames.get(indicator.actor_id)||'Unattributed',
    confidence:indicator.confidence,
    confidenceScore:indicator.confidence_score,
    threatType:indicator.threat_type,
    malware:indicator.malware,
    tags:indicator.tags||[],
    source:indicator.source_name||'Unknown',
    sourceProfiles:indicator.source_profiles||[],
    firstSeen:displayDate(indicator.first_seen),
    lastSeen:displayDate(indicator.last_seen),
    expiresAt:indicator.expires_at,
    syncedAt:indicator.last_synced_at,
    isActive:indicator.is_active
  }));

  reportsList = data.reports.map(report=>({
    title:report.title,
    type:report.type,
    related:report.related,
    date:displayDate(report.published_at),
    format:report.format
  }));

  data.techniques.forEach(technique=>{
    let tactic = tacticsFull.find(item=>item.name.toLowerCase()===technique.tactic.toLowerCase());
    if(!tactic){ tactic={name:technique.tactic,techniques:[]}; tacticsFull.push(tactic); }
    if(!tactic.techniques.some(item=>item.id===technique.id)) tactic.techniques.push({id:technique.id,name:technique.name});
  });
}

async function loadBackendData(){
  state.backendStatus='loading';
  state.backendMessage='Connecting to API';
  render();
  try{
    const data = await apiRequest('/dashboard/bootstrap');
    applyBackendData(data);
    state.backendStatus='live';
    state.backendMessage='Live API data';
  }catch(error){
    state.backendStatus='offline';
    state.backendMessage='Using bundled demonstration data';
    console.warn('ARGUS TI backend unavailable; using bundled data.', error);
  }
  render();
}

/* ---------------- Mount / render ---------------- */

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div style="display:flex;height:100vh;width:100%;overflow:hidden">
    ${renderSidebar()}
    <div style="flex:1;display:flex;flex-direction:column;min-width:0;height:100%">
      ${renderTopbar()}
      <div id="content" style="flex:1;overflow:auto;padding:28px 32px 48px">${renderContent()}</div>
    </div>
  </div>`;

  if(refocusSearch){
    const inp = document.getElementById('actorSearch');
    if(inp){ inp.focus(); const v=inp.value; inp.setSelectionRange(v.length, v.length); }
    refocusSearch = false;
  }
}

const app = document.getElementById('app');

app.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act');
  const id = el.getAttribute('data-id');
  const fn = actions[act];
  if(fn) fn(id);
});

app.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target.closest('[data-act]');
  if(!el || el.tagName==='INPUT') return;
  e.preventDefault();
  const fn = actions[el.getAttribute('data-act')];
  if(fn) fn(el.getAttribute('data-id'));
});

app.addEventListener('input', (e)=>{
  if(e.target && e.target.id==='actorSearch'){
    state.actorSearch = e.target.value;
    refocusSearch = true;
    render();
  }
});

render();
loadBackendData();
</script>
